name: Latest Sandbox Build
on:
  push:
    branches: [crm-demo-gallery-sandbox]
    paths: ['.github/workflows/latest-sandbox-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Tour smoke
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/tour/overview.jpg dist/tour/patients.jpg dist/tour/clinical.jpg; do test -s "$f"; done
          grep -q '/tour/overview.jpg' dist/tour/index.html
          grep -q '/tour/patients.jpg' dist/tour/index.html
          grep -q '/tour/clinical.jpg' dist/tour/index.html
          grep -q 'Watch the 90-sec tour' dist/index.html
          ! grep -q 'taxrescrm.app/book' dist/tour/index.html
          ! grep -q 'browser-shot\|patient-demo-card\|clinical-demo-card' src/pages/tour/index.astro
