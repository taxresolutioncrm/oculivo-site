name: Final Route Smoke

on:
  push:
    branches:
      - crm-demo-gallery-sandbox
    paths:
      - '.github/workflows/final-route-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Serve static site and smoke key routes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory dist >/tmp/oculivo-site.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          routes=(/ /tour/ /demo/ /features/ /pricing/ /communications/ /website-seo/ /locations/ /sitemap.xml /robots.txt)
          for route in "${routes[@]}"; do
            code=$(curl -sS -o /tmp/site-route -w "%{http_code}" "http://127.0.0.1:4174$route")
            echo "$route => $code"
            test "$code" = "200"
          done
          grep -q 'Watch the 90-sec tour' dist/index.html
          grep -q 'Practice overview' dist/tour/index.html
          grep -q 'Patient workspace' dist/tour/index.html
          grep -q 'Clinical records' dist/tour/index.html
          if grep -q 'taxrescrm.app/book' dist/tour/index.html; then
            echo 'Tour page unexpectedly contains booking gate'
            exit 1
          fi
